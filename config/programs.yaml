# Program pages the radar watches for changes.
#
# Each entry always shows up in the report. When the visible text of the
# page changes, it gets a "page changed on <date>" note so you know to look.
#
# Fields:
#   name     (required) what to call it
#   url      (required) the page to watch
#   org      who runs it
#   area     ML | SWE | research | data | quant | hardware | other
#   season   Dec–Feb | Jul | May–Aug | year-round | unknown
#   regions  list: Brazil | LatAm | US/Canada | Europe | Asia/ME | remote
#   warnings list of extra warnings, quoted because of the "?": ["PhD-level?"]
#   notes    a reminder shown in the report
#   student  false if it might not be a student program (adds "unsure")
#   applications  when applications usually open, from past years: "Nov–Jan",
#            "Feb, Aug" (two rounds), "Mar". The site shows it and puts the
#            programs whose applications open soonest first.
#   levels   list: undergrad | masters | phd, when only some can apply
#   render   true if the page is built by JavaScript: it is then opened in a
#            headless browser (slower, needs Playwright)
#
# Leave a field out and the keyword rules fill it in from the page text.
# Every active URL below was checked on 2026-10-05 and returned the page.
# Commented-out entries are blocked for bots (HTTP 403) or are built by
# JavaScript (nothing to watch); see the README.

