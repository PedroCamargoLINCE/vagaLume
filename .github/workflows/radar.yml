name: vagaLume

on:
  schedule:
    - cron: "0 12 * * *"  # 12:00 UTC = 09:00 in Brasília (UTC-3). Runs on the default branch only.
  workflow_dispatch:       # "Run workflow" button on the Actions tab

permissions:
  contents: write          # needed to commit data/*.jsonl and the website data

concurrency:
  group: radar             # never run two copies at once (they would both edit the database)
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 90      # about 35 minutes, the sources running side by side, and the discovery; room for slow days
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install ".[embeddings]"  # embeddings: the field guesses (radar/area_guess.py)
          python -m playwright install --with-deps chromium  # headless browser for Meta

      - name: Keep the title model between runs
        # multilingual-e5-small, about 130 MB, for radar/area_guess.py: downloaded once, then cached.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small

      - name: Find new companies with jobs in Brazil
        # Ashby, Greenhouse and Lever boards seen by Common Crawl (radar/discover.py); the ones with jobs
        # in Brazil go to config/discovered.yaml and are read by the run below. A failure here only
        # means today's list is yesterday's.
        continue-on-error: true
        timeout-minutes: 25
        run: python -m radar discover

      - name: Run the radar
        env:
          # All optional. Missing secrets are simply skipped.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIGEST_KEY: ${{ secrets.DIGEST_KEY }}  # the students' Telegram digest (radar/telegram_bot.py)
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RADAR_REPORT_URL: ${{ vars.RADAR_REPORT_URL }}
        run: python -m radar

      - name: Update the star chart in the README
        # GitHub keeps its own copy of outside images in a README for a day or more, so a chart
        # loaded straight from star-history.com looks stuck. A file in the repo is shown as committed.
        # If star-history is down, the old chart stays.
        continue-on-error: true
        run: |
          for theme in light dark; do
            out=".github/assets/stars-${theme}.svg"
            url="https://api.star-history.com/svg?repos=pedrocamargolince/vagalume&type=Date&theme=${theme}&t=$(date -u +%Y%m%d)"
            if curl -fsSL --retry 3 --max-time 60 "$url" -o /tmp/stars.svg && head -c 5 /tmp/stars.svg | grep -q "<svg"; then
              mv /tmp/stars.svg "$out"
            else
              echo "::warning::star-history.com didn't answer; keeping the old $out"
            fi
          done

      - name: Commit database, report and website data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The database is kept as text (data/*.jsonl); the binary radar.db is a
          # local working copy. The first run after the switch removes it from git.
          git rm --cached --quiet --ignore-unmatch data/radar.db
          git add data/opportunities.jsonl data/page_hashes.jsonl docs/data.json docs/stats.json docs/feed.xml docs/feed-brasil.xml .github/assets/stars-*.svg README.md .github/README.en.md .github/GUIDE.md config/discovered.yaml data/discovery.jsonl
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Radar run $(date -u +%Y-%m-%d)"
          # If you edited config/status.yaml while the run was going, merge that first.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
