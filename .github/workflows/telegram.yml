name: Telegram sign-ups

# Reads new messages to the vagaLume bot every 30 minutes: /start <code>
# subscribes (the code comes from the site's "Receber no Telegram" button),
# /parar unsubscribes. Replies right away and saves the encrypted list in
# data/subscribers.enc. The daily run sends the highlights (radar.yml).
# Does nothing until the TELEGRAM_BOT_TOKEN and DIGEST_KEY secrets exist.
#
# GitHub delays and skips frequent schedules (this one ran every 4-7 hours), so an
# outside scheduler (cron-job.org) also starts it every 15 minutes through the API
# (workflow_dispatch); see .github/GUIDE.md, "Answering sign-ups quickly".

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the bot is set up
        id: setup
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          KEY: ${{ secrets.DIGEST_KEY }}
        run: echo "ready=$([ -n "$TOKEN" ] && [ -n "$KEY" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'yes'

      - uses: actions/setup-python@v5
        if: steps.setup.outputs.ready == 'yes'
        with:
          python-version: "3.12"

      - name: Read new messages
        if: steps.setup.outputs.ready == 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DIGEST_KEY: ${{ secrets.DIGEST_KEY }}
        run: |
          pip install --quiet requests PyYAML cryptography
          python -m radar.telegram_bot collect

      - name: Save the subscriber list
        if: steps.setup.outputs.ready == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/subscribers.enc 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new sign-ups."
            exit 0
          fi
          git commit -m "Telegram sign-ups $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
